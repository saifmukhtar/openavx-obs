OpenAVX.Source.Tip.Section="Switch between groups of settings without scrolling."
OpenAVX.Source.Tip.Bandwidth="Highest uses full SpeedHQ/Uncompressed quality; Lowest requests a low-bandwidth proxy stream; Audio Only disables video."
OpenAVX.Source.Tip.Behavior="Keep connection alive prevents reconnect delays when switching scenes; Disconnect when not visible saves bandwidth."
OpenAVX.Source.Tip.ColorFormat="Auto selects the fastest native format (UYVY or BGRA with alpha). Override only if needed by a downstream filter."
OpenAVX.Source.Tip.ColorRange="Leave on Auto unless levels look washed out or crushed."
OpenAVX.Source.Tip.ColorSpace="Leave on Auto to follow stream metadata (Rec. 709 for HD, Rec. 2100 for HDR)."
OpenAVX.Source.Tip.BufferMode="Lowest Latency renders frames immediately; Synchronised (FrameSync) smooths jitter and locks audio/video timing."
OpenAVX.Source.Tip.DiscoveryGroups="Comma-separated OpenAVX group names to search. Leave blank for Public discovery."
OpenAVX.Source.Tip.Transport="TCP is reliable over LAN/WAN; RUDP uses low-latency reliable UDP; UDP has lowest overhead on clean LANs."
OpenAVX.Source.Tip.FailoverSource="Backup stream to switch to automatically if the primary stream stalls."
OpenAVX.Source.Tip.FailoverTimeout="How long (ms) the primary stream must stall before switching to the failover backup."
OpenAVX.Source.Tip.AutoRevert="Automatically switch back from failover once the primary stream becomes stable again."
OpenAVX.Source.Tip.AutoRevertHold="How long (ms) the primary stream must stay healthy before auto-reverting."
OpenAVX.Source.Tip.CloudTally="Sync OBS Program/Preview tally state to an OpenAVX Cloud Studio room."

OpenAVX.Output.Tip.VideoCompression="Uncompressed uses minimal CPU on fast LANs; SpeedHQ is low-latency broadcast; H.264/HEVC/AV1 use hardware encoders for low bandwidth."
OpenAVX.Output.Tip.SpeedHQQuality="Quality factor (20-98) for SpeedHQ encoding. Higher means sharper video and higher bitrate."
OpenAVX.Output.Tip.Bitrate="Target video bitrate in kbps for H.264, HEVC, or AV1."
OpenAVX.Output.Tip.KeyframeInterval="Frames between keyframes (GOP size) for H.264, HEVC, or AV1. Lower values improve seek/recovery."
OpenAVX.Output.Tip.ColorFormat="Auto uses OBS's native zero-copy format. Choose UYVY/BGRA/RGBA only if a receiver requires a specific pixel format."
OpenAVX.Output.Tip.AudioCompression="Uncompressed sends 32-bit float PCM; Adaptive compresses only on congestion; Always Compressed uses Opus/ADPCM."
OpenAVX.Output.Tip.Groups="Optional comma-separated discovery groups. Leave blank to advertise on Public."
OpenAVX.Output.Tip.BindIP="Pin output sockets to a specific local IP or interface (e.g. 192.168.1.50 or eth0). Leave blank for Auto."
OpenAVX.Output.Tip.FailoverTarget="Optional backup stream name or ip:port advertised to receivers for automatic failover."
OpenAVX.Output.Tip.WebPreview="Serves a browser-playable HTTP fMP4 live preview of the Main Program Output on the specified port."
OpenAVX.Output.Tip.RtspServer="Starts an RTSP 1.0 server for VLC, FFmpeg, or hardware decoders on the specified port (requires Main Program Output)."
